app-id: io.github.smin987.zipper9
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: zipper9

finish-args:
  # X11 & Wayland display
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware acceleration
  - --device=dri
  # File system access (Required for archive creation & extraction across host)
  - --filesystem=host
  - --filesystem=xdg-run/dconf
  # Settings & Theme integration
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

modules:
  - name: zipper9
    buildsystem: simple
    build-commands:
      - install -Dm755 zipper9 -t /app/bin/
      - install -Dm644 io.github.smin987.zipper9.desktop -t /app/share/applications/
      - install -Dm644 io.github.smin987.zipper9.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 io.github.smin987.zipper9.png -t /app/share/icons/hicolor/256x256/apps/
    sources:
      # x86_64 binary
      - type: archive
        url: https://github.com/smin987/zipper9/releases/download/v1.0.1/zipper9-v1.0.1-linux-x86_64.tar.gz
        sha256: 037e6e4ca04d63a869b5e6784e450d68d11807250c50a9d220d816e37f432108
        strip-components: 1
        only-arches:
          - x86_64

      # aarch64 binary
      - type: archive
        url: https://github.com/smin987/zipper9/releases/download/v1.0.1/zipper9-v1.0.1-linux-aarch64.tar.gz
        sha256: d4111d0b4642fcc3c23493d716ac830e2a08fc0ba9dffa797d8273fb51e1f2d5
        strip-components: 1
        only-arches:
          - aarch64

      # Desktop integration metadata
      - type: file
        path: io.github.smin987.zipper9.desktop

      - type: file
        path: io.github.smin987.zipper9.metainfo.xml

      - type: file
        path: io.github.smin987.zipper9.png
