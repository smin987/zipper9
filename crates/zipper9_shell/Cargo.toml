[package]
name = "zipper9_shell"
version = "1.0.0"
edition = "2021"
description = "Windows 11 Modern Context Menu Shell Extension for zipper9"

[lib]
name = "zipper9_shell"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
] }


