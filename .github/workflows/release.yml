name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows 11/10 Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Executable with Spec
        run: |
          pyinstaller zipper9.spec --noconfirm

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "v1.0.0" }
          New-Item -ItemType Directory -Force -Path "release_win"
          Copy-Item "dist\zipper9.exe" "release_win\"
          if (Test-Path "tools\zipper9_shell.msix") {
              Copy-Item "tools\zipper9_shell.msix" "release_win\"
          }
          Copy-Item "LICENSE" "release_win\"
          Copy-Item "README.md" "release_win\"
          Compress-Archive -Path "release_win\*" -DestinationPath "zipper9-$ver-windows-x64.zip"
          # 릴리즈용 단일 포터블 실행 파일명을 zipper9-windows-x64.exe 로 복사
          Copy-Item "dist\zipper9.exe" "zipper9-windows-x64.exe"
          Copy-Item "dist\zipper9.exe" "zipper9.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            zipper9-*-windows-x64.zip
            zipper9-windows-x64.exe
            zipper9.exe

  build-linux:
    name: Build Linux Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            tar_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            tar_arch: aarch64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev 7zip lz4 zstd python3-tk

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Linux Binary with PyInstaller
        run: |
          pyinstaller \
            --name="zipper9" \
            --onefile \
            --noconfirm \
            --add-data="assets:assets" \
            --collect-all="customtkinter" \
            --collect-all="zipper9_ui" \
            --hidden-import="darkdetect" \
            main.py

      - name: Package Debian (.deb) & Portable Archive (.tar.gz)
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          ARCH="${{ matrix.arch }}"
          TAR_ARCH="${{ matrix.tar_arch }}"
          PKG="zipper9_${VER}_${ARCH}"
          
          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/usr/bin"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$PKG/opt/zipper9"

          cat <<EOF > "$PKG/DEBIAN/control"
          Package: zipper9
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: $ARCH
          Maintainer: smin987 <developer@zipper9.org>
          Depends: 7zip | p7zip-full, lz4, zstd
          Description: Ultra-lightweight and high-speed multi-core archiver
           zipper9 combines modern Fluent GUI with native multi-core compression
           engines (7-Zip, LZ4, Zstandard) supporting ZIP, 7z, TAR, and RAR.
          EOF

          # Copy standalone binary & resources
          cp dist/zipper9 "$PKG/opt/zipper9/zipper9"
          chmod +x "$PKG/opt/zipper9/zipper9"
          cp LICENSE "$PKG/opt/zipper9/"
          cp README.md "$PKG/opt/zipper9/"
          cp assets/zipper9.png "$PKG/usr/share/icons/hicolor/256x256/apps/zipper9.png"

          # Symlink executable launcher
          ln -s /opt/zipper9/zipper9 "$PKG/usr/bin/zipper9"

          # Create desktop shortcut
          cat <<EOF > "$PKG/usr/share/applications/zipper9.desktop"
          [Desktop Entry]
          Name=zipper9
          Comment=Ultra-lightweight multi-core archiver
          Exec=zipper9 %F
          Icon=zipper9
          Terminal=false
          Type=Application
          Categories=Utility;Archiving;Compression;
          MimeType=application/zip;application/x-7z-compressed;application/x-tar;application/x-rar;
          EOF

          # Build Debian .deb package
          dpkg-deb --build --root-owner-group "$PKG"

          # Build Standalone Portable .tar.gz
          PORTABLE_DIR="zipper9-v${VER}-linux-${TAR_ARCH}"
          mkdir -p "$PORTABLE_DIR"
          cp dist/zipper9 "$PORTABLE_DIR/"
          cp LICENSE "$PORTABLE_DIR/"
          cp README.md "$PORTABLE_DIR/"
          tar -czvf "zipper9-v${VER}-linux-${TAR_ARCH}.tar.gz" "$PORTABLE_DIR"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            *.deb
            *.tar.gz

  build-macos:
    name: Build macOS Universal Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & create-dmg
        run: |
          brew install 7-zip lz4 zstd create-dmg
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS .app with PyInstaller
        run: |
          pyinstaller \
            --name="zipper9" \
            --windowed \
            --noconfirm \
            --add-data="assets:assets" \
            --hidden-import="customtkinter" \
            --hidden-import="darkdetect" \
            main.py

      - name: Build .dmg Image
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="v1.0.0"; fi
          test -f "dist/zipper9.app/Contents/MacOS/zipper9"
          create-dmg \
            --volname "zipper9-$VER" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "zipper9.app" 175 120 \
            --hide-extension "zipper9.app" \
            --app-drop-link 425 120 \
            "zipper9-$VER-macos.dmg" \
            "dist/zipper9.app" || true

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: |
            *.dmg
            dist/*.app

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binary

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-packages-*
          merge-multiple: true

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-binary

      - name: Create Official Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.zip
            *.exe
            *.deb
            *.tar.gz
            *.dmg
